spring:
  application:
    name: f-commerce

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fcommerce_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

jwt:
    secret: ${JWT_SECRET:yourLocalDevelopmentDefaultSecretKeyThatIsAtLeast32BytesLong}
